name: ofz-recovery

services:
  archive:
    image: docker.io/chrislusf/seaweedfs@sha256:092e57674b53aaa6191b6f3041a16b23f3fcf986dd3fe600f2e0bf31cab34dfe
    entrypoint: [/usr/bin/weed]
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
      - -master.telemetry=false
      - -volume.minFreeSpace=10GiB
      - -filer
      - -filer.disableHttp
      - -s3
      - -s3.config=/run/secrets/s3.json
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    user: '1000:1000'
    working_dir: /data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    ports: ['127.0.0.1:9445:8333']
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    volumes:
      - ${OFZ_RECOVERY_DATA_ROOT:?set the dedicated recovery data root}/data:/data
      - ${OFZ_RECOVERY_DATA_ROOT:?set the dedicated recovery data root}/secrets/s3.json:/run/secrets/s3.json:ro
      - ${OFZ_RECOVERY_DATA_ROOT:?set the dedicated recovery data root}/secrets/security.toml:/etc/seaweedfs/security.toml:ro
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
