name: Codex devbox

on:
  pull_request:
    paths:
      - services/devbox/**
      - packages/scripts/src/shared/cli.ts
      - packages/scripts/src/shared/docker.ts
      - argocd/applications/devbox/**
      - .github/workflows/codex-devbox.yml
      - flake.nix
      - flake.lock
      - nix/packages.nix
      - nix/toolchain-doctor.sh
  push:
    branches: [main]
    paths:
      - services/devbox/**
      - packages/scripts/src/shared/cli.ts
      - packages/scripts/src/shared/docker.ts
      - argocd/applications/devbox/**
      - .github/workflows/codex-devbox.yml
      - flake.nix
      - flake.lock
      - nix/packages.nix
      - nix/toolchain-doctor.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-devbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: arc-amd64
    steps:
      - uses: actions/checkout@v6
      - name: Validate bootstrap and GitOps configuration
        run: |
          set -euo pipefail
          bash -n services/devbox/*.sh
          nix shell --inputs-from . nixpkgs#rsync --command python3 -m unittest discover -s services/devbox/tests -v
          kubectl kustomize argocd/applications/devbox > /tmp/devbox.yaml
          kubectl kustomize argocd/applications/kargo > /tmp/kargo.yaml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: arc-${{ matrix.architecture }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Resolve immutable build metadata
        id: meta
        shell: bash
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          image=registry.ide-newton.ts.net/lab/codex-devbox
          {
            printf 'image=%s\n' "$image"
            printf 'tag=build-%s-run-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARCH"
            printf 'created=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/devbox/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          network: host
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/proompteng/lab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:cache-${{ matrix.architecture }}
          cache-to: type=inline
      - name: Exercise the native image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            set -euo pipefail
            source /etc/profile.d/devbox.sh
            export NIX_REMOTE=local
            cd /opt/lab-seed
            nix develop /opt/lab-toolchain --command toolchain-doctor
            nix-daemon --daemon &
            daemon_pid=$!
            trap "kill $daemon_pid" EXIT
            for attempt in {1..50}; do
              test ! -S /nix/var/nix/daemon-socket/socket || break
              sleep 0.1
            done
            runuser -l codex -c "nix develop /opt/lab-toolchain --command toolchain-doctor"
            runuser -l codex -c "codex app-server daemon bootstrap && codex app-server daemon start && codex app-server daemon stop"
            codex --version
            rustc --version
            cargo --version
            bun run --filter @proompteng/codex build
            (cd services/bumba && node -e "require(\"tree-sitter-json\")")
            cd services/nanoagent
            GOWORK=off go test ./...
          '
      - name: Exercise systemd preparation recovery
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          fixture="$(docker run --detach --rm --privileged --cgroupns private \
            --tmpfs /run --tmpfs /run/lock --entrypoint /sbin/init \
            "$IMAGE" --unit=basic.target)"
          trap 'docker rm --force "$fixture" >/dev/null 2>&1 || true' EXIT
          for _ in {1..50}; do
            if docker exec "$fixture" systemctl is-active --quiet basic.target; then
              break
            fi
            sleep 0.2
          done
          docker exec "$fixture" /bin/bash -c '
            set -euo pipefail
            test "$(cat /proc/1/comm)" = systemd
            systemctl is-active --quiet basic.target
            python3 -m unittest discover -s /opt/lab-seed/services/devbox/tests -p test_prepare_restart.py -v
          '
      - name: Publish validated preparation image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.architecture }}
          DOCKER_COMMAND_RETRY_ATTEMPTS: '24'
          DOCKER_COMMAND_RETRY_DELAY_SECONDS: '30'
        run: |
          set -euo pipefail
          bun packages/scripts/src/shared/docker.ts push "$IMAGE"
          cache="${IMAGE%:*}:cache-$ARCH"
          docker tag "$IMAGE" "$cache"
          bun packages/scripts/src/shared/docker.ts push "$cache"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: arc-amd64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Publish and verify the immutable index
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/codex-devbox.yml@refs/heads/main
        run: bash services/devbox/publish.sh prepare
      - uses: actions/upload-artifact@v4
        with:
          name: codex-devbox-release-contract
          path: .artifacts/codex-devbox/
          include-hidden-files: true
          if-no-files-found: error
      - name: Make the complete release discoverable
        run: bash services/devbox/publish.sh expose
