name: Bayn model images

on:
  pull_request:
    paths:
      - 'services/bayn-model/**'
      - '.github/workflows/bayn-model-images.yml'
      - 'argocd/applications/bayn-model/**'
  push:
    branches: [main]
    paths:
      - 'services/bayn-model/**'
      - '.github/workflows/bayn-model-images.yml'
      - 'argocd/applications/bayn-model/**'

concurrency:
  group: bayn-model-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.ide-newton.ts.net/lab/bayn-model

jobs:
  build:
    name: Bayn model provisioning and serving contracts (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
          - architecture: arm64
            runner: arc-arm64
    steps:
      - uses: actions/checkout@v6
      - name: Resolve source metadata
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: services/bayn-model
          target: test
          platforms: linux/${{ matrix.architecture }}
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:prepare-sha-${{ github.sha }}-run-${{ github.run_id }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.timestamp }}
          cache-from: type=gha,scope=bayn-model-runtime-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=bayn-model-runtime-${{ matrix.architecture }}
      - name: Retain provisioning and admission contract results
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/bayn-model
          reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          docker run --rm --entrypoint python3 "$reference" -m unittest -v test_runtime.py test_admission.py 2>&1 | tee .artifacts/bayn-model/model-cache-tests.log
          docker image inspect "$reference" > .artifacts/bayn-model/runtime-image.json
      - name: Validate launch arguments and middleware against the pinned vLLM runtime
        if: matrix.architecture == 'amd64'
        env:
          VLLM_IMAGE: vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 \
            -v "$PWD/services/bayn-model:/opt/bayn-model:ro" -w /opt/bayn-model \
            -e PYTHONPATH=/opt/bayn-model -e PYTHONDONTWRITEBYTECODE=1 -e VLLM_TARGET_DEVICE=cpu \
            "$VLLM_IMAGE" -m unittest -v test_vllm_contract.py \
            2>&1 | tee .artifacts/bayn-model/vllm-contract.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayn-model-proof-${{ matrix.architecture }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/bayn-model
          if-no-files-found: error
      - name: Publish tested platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REGCTL_CONFIG: ${{ runner.temp }}/bayn-model-regctl-${{ matrix.architecture }}.json
        run: |
          set -euo pipefail
          reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          archive="${RUNNER_TEMP}/bayn-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}.tar"
          trap 'rm -f "$archive" "$REGCTL_CONFIG"' EXIT
          regctl version
          regctl registry set "${IMAGE%%/*}" --tls enabled \
            --blob-chunk 4194304 --blob-max 4194304 --req-concurrent 1
          docker image save --output "$archive" "$reference"
          config_path="$(tar -xOf "$archive" manifest.json | jq -er 'if length == 1 then .[0].Config else error("expected one saved image") end')"
          config_digest="sha256:$(tar -xOf "$archive" "$config_path" | sha256sum | cut -d ' ' -f 1)"
          regctl image import "$reference" "$archive"
          regctl manifest get "$reference" --platform "linux/${ARCHITECTURE}" --format raw-body \
            | jq -e --arg config "$config_digest" '.config.digest == $config' >/dev/null

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: arc-arm64
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Assemble and validate the immutable release index
        id: release
        run: |
          set -euo pipefail
          mkdir -p .artifacts/bayn-model
          source_timestamp="$(git show -s --format=%cI HEAD)"
          for architecture in amd64 arm64; do
            reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${architecture}"
            crane config --platform "linux/${architecture}" "$reference" | jq -e --arg sha "$GITHUB_SHA" --arg time "$source_timestamp" \
              --arg arch "$architecture" \
              '.architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $sha and
               .config.Labels["org.opencontainers.image.created"] == $time' >/dev/null
          done
          reference="${IMAGE}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          docker buildx imagetools create --tag "$reference" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:ai.proompteng.github-actions-run-id=${GITHUB_RUN_ID}" \
            --annotation 'index:ai.proompteng.github-actions-build-conclusion=success' \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-amd64" \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-arm64"
          crane manifest "$reference" > .artifacts/bayn-model/index.json
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.revision"] == $sha and
             .annotations["org.opencontainers.image.source"] == $source and
             .annotations["ai.proompteng.github-actions-run-id"] == $run and
             .annotations["ai.proompteng.github-actions-build-conclusion"] == "success" and
             ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            .artifacts/bayn-model/index.json >/dev/null
          digest="$(crane digest "$reference")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${IMAGE}@${digest}"
          cosign verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/bayn-model-images.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${digest}" \
            > .artifacts/bayn-model/signature.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bayn-model-release-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/bayn-model
          if-no-files-found: error
      - name: Expose the validated digest to Kargo
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          alias="${IMAGE}:kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          if existing="$(crane digest "$alias" 2>/tmp/bayn-model-alias-error)"; then
            test "$existing" = "$DIGEST"
          else
            grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' /tmp/bayn-model-alias-error
            crane tag "${IMAGE}@${DIGEST}" "kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          fi
          test "$(crane digest "$alias")" = "$DIGEST"
