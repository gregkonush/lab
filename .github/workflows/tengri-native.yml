name: Tengri native architecture

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      runner:
        required: true
        type: string
      kvm_samples:
        required: true
        type: string

permissions:
  contents: read

env:
  NANOAGENT_IMAGE: registry.ide-newton.ts.net/lab/nanoagent
  TENGRI_IMAGE: registry.ide-newton.ts.net/lab/tengri

jobs:
  build:
    if: github.repository == 'proompteng/lab' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Build ${{ matrix.service }} (${{ inputs.architecture }})
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tengri
            context: services/tengri
            image: registry.ide-newton.ts.net/lab/tengri
          - service: nanoagent
            context: services/nanoagent
            image: registry.ide-newton.ts.net/lab/nanoagent
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          build-contexts: |
            ofz-proto=proto
            ofz-catalog=services/ofz
          platforms: linux/${{ inputs.architecture }}
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}-${{ inputs.architecture }}
          cache-from: type=registry,ref=${{ matrix.image }}:cache-${{ inputs.architecture }}
          cache-to: type=registry,ref=${{ matrix.image }}:cache-${{ inputs.architecture }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

  validate-kvm:
    name: Validate KVM slot (${{ inputs.architecture }})
    needs: build
    timeout-minutes: 90
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust for the owning Ofz migrator
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache Ofz migrator dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ofz-native-migrator-${{ inputs.architecture }}
          workspaces: services/ofz -> target

      - name: Install execution network and fixture build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends iproute2 build-essential protobuf-compiler openssl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build guest test binaries
        uses: docker/build-push-action@v6
        with:
          context: services/nanoagent
          platforms: linux/${{ inputs.architecture }}
          target: kvm-tests
          push: true
          tags: ${{ env.NANOAGENT_IMAGE }}:kvm-tests-${{ github.sha }}-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=registry,ref=${{ env.NANOAGENT_IMAGE }}:cache-${{ inputs.architecture }}

      - name: Pull and verify paired boot artifacts
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          guest="${NANOAGENT_IMAGE}:sha-${GITHUB_SHA}-${ARCHITECTURE}"
          docker pull "$guest"
          docker run --rm --read-only --cap-drop ALL \
            --entrypoint /usr/bin/sha256sum "$guest" --check /guest/SHA256SUMS

      - name: Build native KVM test harness
        uses: docker/build-push-action@v6
        with:
          context: services/tengri
          file: services/tengri/Dockerfile
          target: kvm-test
          platforms: linux/${{ inputs.architecture }}
          load: true
          tags: tengri-kvm-test:validation
          build-contexts: |
            ofz-proto=proto
            ofz-catalog=services/ofz
            nanoagent-tests=docker-image://${{ env.NANOAGENT_IMAGE }}:kvm-tests-${{ github.sha }}-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: |
            type=registry,ref=${{ env.TENGRI_IMAGE }}:cache-${{ inputs.architecture }}
            type=registry,ref=${{ env.TENGRI_IMAGE }}:cache-kvm-${{ inputs.architecture }}
          cache-to: type=registry,ref=${{ env.TENGRI_IMAGE }}:cache-kvm-${{ inputs.architecture }},mode=max,ignore-error=true

      - name: Verify real guest administration and snapshot lifecycle
        env:
          TENGRI_KVM_TEST_IMAGE: tengri-kvm-test:validation
          TENGRI_KVM_GUEST_IMAGE: ${{ env.NANOAGENT_IMAGE }}:sha-${{ github.sha }}-${{ inputs.architecture }}
          TENGRI_KVM_OUTPUT: ${{ github.workspace }}/.artifacts/kvm
          TENGRI_KVM_SAMPLES: ${{ inputs.kvm_samples }}
          TENGRI_KVM_SECCOMP: ${{ github.workspace }}/.artifacts/runner-seccomp.json
        run: |
          mkdir -p .artifacts
          jq -e '.machine.seccompProfiles[] | select(.name == "tengri-runner.json") | .value' \
            devices/galactic/omni/tengri-runner-${{ inputs.architecture }}.json > "$TENGRI_KVM_SECCOMP"
          bash services/ofz/test-control.sh kvm

      - name: Retain KVM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tengri-kvm-${{ inputs.architecture }}-${{ github.sha }}
          path: .artifacts/kvm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
