apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: bayn-research
  labels:
    app.kubernetes.io/name: bayn-research
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  restate:
    register:
      service:
        name: restate
        namespace: restate
        port: 9070
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-research
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-research
        app.kubernetes.io/part-of: bayn
    spec:
      nodeSelector:
        network.proompteng.ai/100g: 'true'
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: research
          image: bayn-main
          command: [node, dist/restate-research-server.js]
          ports:
            - name: restate
              containerPort: 9080
          env:
            - name: RESTATE_REQUEST_IDENTITY_KEYS
              value: publickeyv1_6PArFXa3x8V1xx69kZVRyB7uP1fUoZ44wes6vAHYF6NL
            - name: BAYN_RESEARCH_INFERENCE_POLICY
              value: '{"model":"alpha-r1-82c2aa5fcdda","checkpoint":"82c2aa5fcdda6b4ff00caeba68b0903f13d0e1a5","servingImage":"sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2","tokenizerRevision":"82c2aa5fcdda6b4ff00caeba68b0903f13d0e1a5","chatTemplateRevision":"82c2aa5fcdda6b4ff00caeba68b0903f13d0e1a5","temperature":0,"top_p":0.7,"top_k":-1,"min_p":0,"seed":1,"presence_penalty":0,"frequency_penalty":0,"repetition_penalty":1,"enable_thinking":true,"max_tokens":4096,"stop":[],"maximumFactors":5}'
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-research-db
                  key: fqdn-uri
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://observability-tempo-distributor.observability.svc.cluster.local:4318/v1/traces
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: restate
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: restate
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: restate
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
