apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bayn-research
  labels:
    app.kubernetes.io/part-of: bayn
spec:
  groups:
    - name: bayn-research
      rules:
        - alert: BaynResearchWorkerStale
          expr: time() - bayn_research_worker_heartbeat_seconds > 120 or absent_over_time(bayn_research_worker_heartbeat_seconds[10m])
          for: 5m
          labels:
            severity: warning
            notify: email
          annotations:
            summary: Bayn research worker stopped publishing telemetry
            description: Inspect bayn-research deployment and its database connection. Trading execution runs independently.
        - alert: BaynResearchAttemptsFailing
          expr: sum(increase(bayn_research_attempts_total{outcome!="COMPLETE"}[15m])) >= 3
          for: 5m
          labels:
            severity: warning
            notify: email
          annotations:
            summary: Bayn research attempts are failing
            description: Join runId and receiptHash in bayn-research logs and traces. Check model expiry, invalid streams and input registration.
        - alert: BaynResearchCostCoverageIncomplete
          expr: bayn_research_unpriced_attempts > 0 or bayn_research_ambiguous_attempts > 0 or bayn_research_oldest_pending_expense_seconds > 300
          for: 10m
          labels:
            severity: warning
            notify: email
          annotations:
            summary: Bayn research costs lack complete verified coverage
            description: Inspect retained run and receipt identities, local cost basis and expense projection. Unknown costs prevent a fully costed comparison.
