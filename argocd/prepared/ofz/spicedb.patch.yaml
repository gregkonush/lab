apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  name: ofz
  namespace: ofz
spec:
  config:
    dispatchCacheEnabled: 'false'
    dispatchClusterCacheEnabled: 'false'
    datastoreConnPoolReadMaxOpen: '10'
    datastoreConnPoolReadMinOpen: '2'
    datastoreConnPoolWriteMaxOpen: '4'
    datastoreConnPoolWriteMinOpen: '1'
