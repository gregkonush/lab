apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tengri
resources:
  - ../../applications/tengri
patches:
  - path: deployment.patch.yaml
  - path: resource-quota.patch.yaml
  - path: rbac.patch.yaml
  - target:
      kind: NetworkPolicy
      name: tengri-control-plane
    patch: |-
      - op: replace
        path: /spec/egress/0
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ofz
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: ofz-api
          ports:
            - protocol: TCP
              port: 9443
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ofz
              podSelector:
                matchLabels:
                  cnpg.io/cluster: ofz-db
          ports:
            - protocol: TCP
              port: 5432
  - target:
      kind: NetworkPolicy
      name: tengri-slots
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ofz
              podSelector:
                matchLabels:
                  cnpg.io/cluster: ofz-db
          ports:
            - protocol: TCP
              port: 5432
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: tengri-runtime
        namespace: tengri
      $patch: delete
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: tengri-spicedb-key
        namespace: tengri
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: tengri-auth-nonces
        namespace: tengri
      $patch: delete
