apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - ../../applications/keycloak
  - ../../applications/keycloak/tengri
  - pod-disruption-budget.yaml
  - certificate.yaml
  - network-policy.yaml
patches:
  - path: keycloak.patch.yaml
  - path: postgres-cluster.patch.yaml
  - patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        entryPoints: [websecure]
        tls:
          secretName: auth-proompteng-ai-tls
