apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 2
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: keycloak
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
          env:
            - name: KC_HOSTNAME
              value: https://auth.proompteng.ai
            - name: KC_HOSTNAME_STRICT
              value: 'true'
            - name: KC_CACHE_STACK
              value: jdbc-ping
            - name: KC_CACHE_EMBEDDED_MTLS_ENABLED
              value: 'true'
            - name: KC_SPI_CACHE_EMBEDDED__DEFAULT__NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KC_SPI_CACHE_EMBEDDED__DEFAULT__MACHINE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw.keycloak.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/var/run/keycloak/database-ca/ca.crt&connectTimeout=2&socketTimeout=5
            - name: KC_DB_URL_DATABASE
              $patch: delete
            - name: KC_DB_URL_HOST
              $patch: delete
            - name: KC_DB_URL_PORT
              $patch: delete
            - name: KC_DB_POOL_INITIAL_SIZE
              value: '2'
            - name: KC_DB_POOL_MIN_SIZE
              value: '2'
            - name: KC_DB_POOL_MAX_SIZE
              value: '20'
            - name: KC_DB_POOL_ACQUISITION_TIMEOUT
              value: '5s'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-ca
              mountPath: /var/run/keycloak/database-ca
              readOnly: true
      volumes:
        - name: database-ca
          secret:
            secretName: keycloak-db-ca
            defaultMode: 0440
