apiVersion: apps/v1
kind: Deployment
metadata:
  name: proompteng
  namespace: proompteng
spec:
  replicas: 2
  template:
    spec:
      nodeSelector: null
      securityContext:
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: proompteng
      containers:
        - name: proompteng
          env:
            - name: BETTER_AUTH_URL
              $patch: delete
            - name: OFZ_GRPC_ENDPOINT
              value: ofz-api.ofz.svc.cluster.local:9443
            - name: TENGRI_DESKTOP_ORIGIN
              value: https://proompteng.ai
            - name: TENGRI_OIDC_ISSUER
              value: https://auth.proompteng.ai/realms/tengri
            - name: TENGRI_OIDC_CONNECT_IP
              value: 100.100.244.181
            - name: TENGRI_OIDC_CLIENT_SECRET_FILE
              value: /var/run/tengri/oidc/client-secret
            - name: TENGRI_DATABASE_DSN
              value: postgres://tengri_bff@ofz-db-rw.ofz.svc.cluster.local:5432/tengri_control
            - name: TENGRI_DATABASE_PASSWORD_FILE
              value: /var/run/tengri/database/password
            - name: TENGRI_DATABASE_CA_FILE
              value: /var/run/tengri/database-ca/ca.crt
          volumeMounts:
            - name: oidc
              mountPath: /var/run/tengri/oidc
              readOnly: true
            - name: database
              mountPath: /var/run/tengri/database
              readOnly: true
            - name: database-ca
              mountPath: /var/run/tengri/database-ca
              readOnly: true
      volumes:
        - name: tengri-bff
          secret:
            secretName: tengri-internal-request-key
            defaultMode: 0440
        - name: oidc
          secret:
            secretName: tengri-oidc-client
            defaultMode: 0440
        - name: database
          secret:
            secretName: tengri-bff-db
            defaultMode: 0440
        - name: database-ca
          secret:
            secretName: ofz-database-ca
            defaultMode: 0440
