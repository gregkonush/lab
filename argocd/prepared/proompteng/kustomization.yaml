apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: proompteng
resources:
  - ../../applications/proompteng
  - pod-disruption-budget.yaml
patches:
  - path: deployment.patch.yaml
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: tengri-bff
        namespace: proompteng
      $patch: delete
  - target:
      kind: NetworkPolicy
      name: proompteng-web
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ofz
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: ofz-api
          ports:
            - protocol: TCP
              port: 9443
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ofz
              podSelector:
                matchLabels:
                  cnpg.io/cluster: ofz-db
          ports:
            - protocol: TCP
              port: 5432
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 100.100.244.181/32
          ports:
            - protocol: TCP
              port: 443
      - op: add
        path: /spec/egress/-
        value:
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
          ports:
            - protocol: TCP
              port: 8443
