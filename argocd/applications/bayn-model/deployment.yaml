apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn-model
  labels:
    app.kubernetes.io/name: bayn-model
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-model
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: turin
        nvidia.com/gpu.present: "true"
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: provision-model
          image: registry.ide-newton.ts.net/lab/bayn-model:unpromoted
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: runtime
              mountPath: /runtime
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2
          command: [python3, /opt/bayn-model/serve.py]
          env:
            - name: BAYN_MODEL_SERVING_IMAGE
              value: sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2
            - name: PYTHONPATH
              value: /opt/bayn-model
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: bayn-model
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: http/protobuf
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HOME
              value: /models/cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_IMPLICIT_TOKEN
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /models/cache/vllm
            - name: CUDA_CACHE_PATH
              value: /models/cache/cuda
            - name: HOME
              value: /tmp
            - name: OMP_NUM_THREADS
              value: "4"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: runtime
              mountPath: /opt/bayn-model
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 1Mi
        - name: models
          persistentVolumeClaim:
            claimName: bayn-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
