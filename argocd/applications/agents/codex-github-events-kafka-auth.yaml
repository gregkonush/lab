apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-kafka-secret-reader
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-kafka-secret-reader
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kafka-codex-credentials, kafka-codex-username]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-kafka-secret-reader
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agents-kafka-secret-reader
subjects:
  - kind: ServiceAccount
    name: agents-kafka-secret-reader
    namespace: agents
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agents-kafka-credentials
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    kubernetes:
      remoteNamespace: agents
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: agents-kafka-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-codex-github-events-kafka-auth
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: agents-kafka-credentials
  target:
    name: agents-codex-github-events-kafka-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          kafka.eventing.knative.dev/kafka-secret: "true"
      data:
        protocol: SASL_PLAINTEXT
        sasl.mechanism: '{{ .mechanism }}'
        user: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: kafka-codex-credentials
        property: password
    - secretKey: username
      remoteRef:
        key: kafka-codex-username
        property: username
    - secretKey: mechanism
      remoteRef:
        key: kafka-codex-username
        property: saslType
