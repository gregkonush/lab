apiVersion: v1
kind: ResourceQuota
metadata:
  name: tengri
spec:
  hard:
    count/microvms.runtime.proompteng.ai: "6"
    # Six slot Leases plus the shared controller election Lease.
    count/leases.coordination.k8s.io: "7"
    persistentvolumeclaims: "6"
    requests.storage: 192Gi
    pods: "8"
    # Six slot bootstraps, four Ofz credentials, and two retained pre-cutover keys.
    secrets: "12"
    # Six runners, six host supervisors, and the controller with its mesh proxy.
    requests.cpu: "26"
    limits.cpu: "27"
    requests.memory: 56Gi
    limits.memory: 56Gi
