kind: ExternalSecret
metadata:
  name: relay-runtime-db-auth
  namespace: ofz
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: relay-runtime-db-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: relay_runtime
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: relay-runtime/runtime-password
