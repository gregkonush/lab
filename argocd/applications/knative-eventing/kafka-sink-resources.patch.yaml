apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-sink-receiver
  namespace: knative-eventing
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: kafka-sink-receiver
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
