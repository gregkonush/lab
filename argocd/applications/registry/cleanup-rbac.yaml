apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-cleanup-references
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list]
  # Explicit non-core CRD groups; never grant access to Kubernetes Secrets.
  # A newly served group requires a reviewed addition or discovery fails closed.
  - apiGroups:
      - acme.cert-manager.io
      - actions.github.com
      - agents.proompteng.ai
      - approvals.proompteng.ai
      - argocd-image-updater.argoproj.io
      - argoproj.io
      - artifacts.proompteng.ai
      - authzed.com
      - autoscaling.internal.knative.dev
      - backup.kubevirt.io
      - barmancloud.cnpg.io
      - bitnami.com
      - budgets.proompteng.ai
      - caching.internal.knative.dev
      - cdi.kubevirt.io
      - ceph.rook.io
      - cert-manager.io
      - clickhouse-keeper.altinity.com
      - clickhouse.altinity.com
      - clone.kubevirt.io
      - core.openfeature.dev
      - core.strimzi.io
      - crdb.cockroachlabs.com
      - csi.ceph.io
      - eventing.knative.dev
      - export.kubevirt.io
      - extensions.istio.io
      - external-secrets.io
      - flink.apache.org
      - flows.knative.dev
      - forklift.cdi.kubevirt.io
      - gateway.networking.k8s.io
      - generators.external-secrets.io
      - groupsnapshot.storage.k8s.io
      - hub.traefik.io
      - instancetype.kubevirt.io
      - internal.kafka.eventing.knative.dev
      - jetstream.nats.io
      - k8s.cni.cncf.io
      - kafka.strimzi.io
      - kargo.akuity.io
      - kubevirt.io
      - messaging.knative.dev
      - metallb.io
      - migrations.kubevirt.io
      - networking.internal.knative.dev
      - networking.istio.io
      - nfd.k8s-sigs.io
      - nvidia.com
      - objectbucket.io
      - operator.knative.dev
      - orchestration.proompteng.ai
      - plugin.kubevirt.io
      - pool.kubevirt.io
      - postgresql.cnpg.io
      - rds.valkey.buf.red
      - redis.redis.opstreelabs.in
      - resource.nvidia.com
      - restate.dev
      - runtime.proompteng.ai
      - schedules.proompteng.ai
      - security.istio.io
      - security.proompteng.ai
      - serving.knative.dev
      - signals.proompteng.ai
      - sinks.knative.dev
      - snapshot.kubevirt.io
      - snapshot.storage.k8s.io
      - sources.knative.dev
      - spire.spiffe.io
      - swarm.proompteng.ai
      - tailscale.com
      - telemetry.istio.io
      - template.kubevirt.io
      - tigerbeetle.proompteng.ai
      - tools.proompteng.ai
      - traefik.io
      - valkey.buf.red
      - whereabouts.cni.cncf.io
      - workspaces.proompteng.ai
    resources: ["*"]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [registry]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: registry-cleanup-references
subjects:
  - kind: ServiceAccount
    name: registry-cleanup
    namespace: registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-cleanup-references
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleanup
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [registry-data]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [registry]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-cleanup
subjects:
  - kind: ServiceAccount
    name: registry-cleanup
    namespace: registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-cleanup
