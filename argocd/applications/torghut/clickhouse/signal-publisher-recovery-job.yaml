apiVersion: batch/v1
kind: Job
metadata:
  name: signal-adjusted-daily-recovery-20261012
  namespace: torghut
  labels:
    app.kubernetes.io/name: signal-adjusted-daily-publisher
    app.kubernetes.io/part-of: signal
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-adjusted-daily-publisher
        app.kubernetes.io/part-of: signal
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Never
      serviceAccountName: torghut-runtime
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          image: registry.ide-newton.ts.net/lab/signal-publisher:bootstrap
          imagePullPolicy: IfNotPresent
          args:
            - >
              if (Date.now() + 900_000 >= Date.parse('2026-10-13T13:00:00Z')) {
                throw new Error('Recovery start deadline passed; preserving the next scheduled writer window')
              }

              process.argv = ['node', 'dist/main.js', 'backfill', '--start',
              '2016-01-04', '--end', '2026-10-12']

              await import('./dist/main.js')
          env:
            - name: SIGNAL_UNIVERSE_ID
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_ID
            - name: SIGNAL_UNIVERSE_SYMBOL_HASH
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_SYMBOL_HASH
            - name: SIGNAL_SYMBOLS
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_SYMBOLS
            - name: SIGNAL_START_DATE
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: HISTORY_START_DATE
            - name: SIGNAL_ALPACA_FEED
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: HISTORY_FEED
            - name: SIGNAL_CODE_REVISION
              value: f34b6492c746608bcaa6e068328c60da4d39754a
            - name: SIGNAL_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/signal-publisher
            - name: SIGNAL_IMAGE_DIGEST
              value: sha256:1c89ed7305214f9896ebcf59c6f6b1e289fdbdfdf1fb7f41e6c7f699386e9ffa
            - name: SIGNAL_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: SIGNAL_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: signal-publisher-clickhouse-auth
                  key: username
            - name: SIGNAL_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signal-publisher-clickhouse-auth
                  key: password
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: torghut-alpaca
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: torghut-alpaca
                  key: APCA_API_SECRET_KEY
            - name: SIGNAL_CALENDAR_VERSION
              value: alpaca-us-equity-calendar-v1
            - name: SIGNAL_FINALIZATION_LAG_MINUTES
              value: "90"
            - name: SIGNAL_OPERATION_TIMEOUT_MS
              value: "180000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - node
            - --input-type=module
            - --eval
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
