apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tengri
commonAnnotations:
  delivery.proompteng.ai/source-revision: unpromoted
  delivery.proompteng.ai/image-digest: unpromoted
  delivery.proompteng.ai/github-run-id: unpromoted
resources:
  - service-account.yaml
  - secrets.yaml
  - migration.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml
configMapGenerator:
  - name: relay-catalog
    files:
      - providers.json
images:
  - name: registry.ide-newton.ts.net/lab/relay
    newTag: unpromoted
