apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: relay-keyring
  namespace: tengri
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: relay-keyring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: keyring.json
      remoteRef:
        key: relay-runtime/keyring
---
