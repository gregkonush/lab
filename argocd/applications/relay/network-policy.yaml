apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tengri-connector-broker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proompteng
          podSelector:
            matchLabels:
              app: proompteng
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ofz
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ofz-api
      ports:
        - protocol: TCP
          port: 9443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ofz
          podSelector:
            matchLabels:
              cnpg.io/cluster: ofz-db
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relay-migrate
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ofz
          podSelector:
            matchLabels:
              cnpg.io/cluster: ofz-db
      ports:
        - protocol: TCP
          port: 5432
