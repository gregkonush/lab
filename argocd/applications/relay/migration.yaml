apiVersion: batch/v1
kind: Job
metadata:
  name: relay-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: relay-migrator
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.ide-newton.ts.net/lab/relay:unpromoted
          args: [migrate]
          env:
            - name: RELAY_DATABASE_DSN
              value: host=ofz-db-rw.ofz.svc.cluster.local port=5432 dbname=relay_control user=relay_migrator sslmode=require
            - name: RELAY_DATABASE_PASSWORD_FILE
              value: /var/run/relay/database/password
            - name: RELAY_DATABASE_CA_FILE
              value: /var/run/relay/database-ca/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /var/run/relay/database
              readOnly: true
            - name: database-ca
              mountPath: /var/run/relay/database-ca
              readOnly: true
      volumes:
        - name: database
          secret:
            secretName: relay-migrator-db-auth
            defaultMode: 288
        - name: database-ca
          secret:
            secretName: ofz-database-ca
            defaultMode: 288
