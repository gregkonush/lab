apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bayn-opencode-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn-opencode
  labels:
    app.kubernetes.io/name: bayn-opencode
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-opencode
        app.kubernetes.io/part-of: bayn
    spec:
      nodeSelector:
        network.proompteng.ai/100g: 'true'
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: bayn-main
          command: [node, dist/opencode-command.js]
          env:
            - name: BAYN_PUBLIC_INFORMATION_PROXY
              value: http://bayn-egress-proxy.bayn.svc.cluster.local:3128
            - name: NODE_ENV
              value: production
          ports:
            - name: proposal
              containerPort: 4096
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: proposal
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: proposal
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: proposal
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/bayn-opencode
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: bayn-opencode-state
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bayn-opencode
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bayn-opencode
  ports:
    - name: proposal
      port: 4096
      targetPort: proposal
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-opencode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-opencode
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-research
      ports:
        - port: 4096
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-egress-proxy
      ports:
        - port: 3128
          protocol: TCP
