apiVersion: batch/v1
kind: Job
metadata:
  name: opencode-research-state-export
  annotations:
    migration.proompteng.ai/source-pvc-uid: 1a310eab-4868-4742-bc1e-b61abf37e4d9
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-state-export
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: export
          # Frozen helper from the already qualified Bayn release; not a promotion input.
          image: registry.ide-newton.ts.net/lab/bayn@sha256:dc282c860fb41a56da60fce455530dabd534c4874ef8400bad7968c72ebede32
          command: [sh, -c, 'until test -f /tmp/export-complete; do sleep 5; done']
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: bayn-opencode-state
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-state-export
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opencode-state-export
  policyTypes: [Ingress, Egress]
