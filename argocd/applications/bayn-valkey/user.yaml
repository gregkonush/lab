apiVersion: valkey.buf.red/v1alpha1
kind: User
metadata:
  name: cluster-acl-bayn-valkey-default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accountType: custom
  arch: cluster
  instanceName: bayn-valkey
  username: default
  passwordSecrets:
    - bayn-valkey-auth
  aclRules: "+@read +@write +@connection -@dangerous -flushall -flushdb +cluster|slots +cluster|shards +cluster|nodes +cluster|info +cluster|keyslot +wait ~bayn:* &bayn:*"
