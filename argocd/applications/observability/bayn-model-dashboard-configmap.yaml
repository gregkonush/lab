apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-model-performance-dashboard
  namespace: observability
data:
  bayn-model-performance-dashboard.json: |
    {
      "uid": "bayn-model-performance",
      "title": "Bayn Model Performance",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "description": "Private Alpha-R1 research serving. No model request is made by Bayn execution. Latency, usage and capacity do not establish economic value.",
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "bayn",
        "research",
        "inference"
      ],
      "links": [
        {
          "type": "link",
          "title": "Bayn Execution Operations",
          "url": "/d/bayn-cycle-operations",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Scrape availability",
          "description": "Research availability is independent of Bayn trading readiness.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"bayn-model\"}",
              "legendFormat": "vLLM"
            },
            {
              "refId": "B",
              "expr": "up{job=\"bayn-model-admission\"}",
              "legendFormat": "admission"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Admitted, running and waiting",
          "description": "Admission allows two in-flight requests; the engine runs one sequence.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "bayn_model_inflight{job=\"bayn-model-admission\"}",
              "legendFormat": "admitted"
            },
            {
              "refId": "B",
              "expr": "sum(vllm:num_requests_running{job=\"bayn-model\"})",
              "legendFormat": "running"
            },
            {
              "refId": "C",
              "expr": "sum(vllm:num_requests_waiting{job=\"bayn-model\"})",
              "legendFormat": "waiting"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "End-to-end latency",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Time to first token",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Queue time",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:request_queue_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:request_queue_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:request_queue_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Prefill time",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:request_prefill_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:request_prefill_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:request_prefill_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Decode time",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:request_decode_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:request_decode_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:request_decode_time_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Time per output token",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(vllm:request_time_per_output_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:request_time_per_output_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(vllm:request_time_per_output_token_seconds_bucket{job=\"bayn-model\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Token throughput",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:prompt_tokens_total{job=\"bayn-model\"}[5m]))",
              "legendFormat": "prompt tokens/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(vllm:generation_tokens_total{job=\"bayn-model\"}[5m]))",
              "legendFormat": "generation tokens/s"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Token usage",
          "description": "Usage is measured. Infrastructure expense allocation is separate; these tokens do not have a vendor API price.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(vllm:prompt_tokens_total{job=\"bayn-model\"}[1h]))",
              "legendFormat": "prompt"
            },
            {
              "refId": "B",
              "expr": "sum(increase(vllm:generation_tokens_total{job=\"bayn-model\"}[1h]))",
              "legendFormat": "generated"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Admission outcomes",
          "description": "Includes rejected requests, expired work, cancellation, client/backend errors and completed responses.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(outcome) (increase(bayn_model_requests_total{job=\"bayn-model-admission\"}[15m]))",
              "legendFormat": "Outcome {{outcome}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "KV cache occupancy and preemptions",
          "description": "KV occupancy is a fraction; physical VRAM also includes weights, graphs, Flamingo and Plex.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(vllm:kv_cache_usage_perc{job=\"bayn-model\"})",
              "legendFormat": "KV occupancy"
            },
            {
              "refId": "B",
              "expr": "sum(increase(vllm:num_preemptions_total{job=\"bayn-model\"}[5m]))",
              "legendFormat": "preemptions / 5m"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Host working set",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"bayn-model\",container=\"vllm\"})",
              "legendFormat": "working set"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Serving CPU and restarts",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"bayn-model\",container=\"vllm\"}[5m]))",
              "legendFormat": "CPU cores"
            },
            {
              "refId": "B",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"bayn-model\",container=\"vllm\"}[15m]))",
              "legendFormat": "restarts / 15m"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
