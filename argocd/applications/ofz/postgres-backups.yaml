apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ofz-db
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  retentionPolicy: 35d
  instanceSidecarConfiguration:
    logLevel: info
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  configuration:
    destinationPath: s3://ofz-database-backups/
    endpointURL: https://nuc.ide-newton.ts.net:9444
    s3Credentials:
      accessKeyId:
        name: ofz-database-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: ofz-database-backup
        key: AWS_SECRET_ACCESS_KEY
    data:
      encryption: AES256
      compression: snappy
      jobs: 1
    wal:
      encryption: AES256
      compression: snappy
      maxParallel: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ofz-db-daily
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  schedule: "0 30 10 * * *"
  immediate: false
  backupOwnerReference: cluster
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: ofz-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: ofz-db-nuc-cutover-primary
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: ofz-db
  target: primary
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
